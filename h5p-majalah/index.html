<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content='15; url=https://warung.bahasa.fr' http-equiv='refresh'/>
    <title>Majalah Bahasa.FR</title>
    <style>
        /* Reset margin dan padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        img {
            max-width: 300px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #555;
        }

        footer {
            position: absolute;
            bottom: 10px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- Gambar ilustrasi -->
    <img src="/dalam_perbaikan.gif?text=Under+Construction" alt="Under Construction">

    <!-- Pesan utama -->
    <h1>Laman ini masih dalam pengembangan.</h1>
    <p>Kami sedang bekerja keras untuk menghadirkan konten terbaik. Silakan kembali lagi nanti.</p>

    <!-- Footer -->
    <footer>&copy; 2026 Majalah Bahasa.FR</footer>

</body>
</html>
